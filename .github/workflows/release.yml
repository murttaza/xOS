name: Build & Release

on:
  push:
    branches: [main]

# Only allow one release build at a time
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Get version
        id: version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: npm test

      - name: Build
        env:
          # The anon key is publishable by design (it ships inside every client
          # bundle); these literals carry no extra exposure. TODO: move to repo
          # Actions secrets (VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY) so key
          # rotation is a one-place change — flip these to ${{ secrets.* }} then.
          VITE_SUPABASE_URL: https://wzsylueaydrjdpyrpsjh.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_F08DcFWkcrMYGirI0dPaGA_Q2BvrBEB
        run: npx tsc && npx vite build

      - name: Package & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: false
        run: npx electron-builder --publish always

      # electron-builder left v5.15.0 as a draft despite EP_DRAFT=false —
      # force-publish so auto-update actually sees the new version.
      - name: Un-draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ steps.version.outputs.VERSION }}" --draft=false --latest
